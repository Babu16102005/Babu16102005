<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00ffa3" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-text {
        font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Segoe UI Mono', monospace;
      }
      
      /* Blinking Cursor Animation */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
      }

      /* Live Pulse Dot */
      @keyframes pulseGlow {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #00ffa3); }
        100% { transform: scale(0.95); opacity: 0.7; }
      }
      .pulse-circle {
        transform-origin: 105px 23px;
        animation: pulseGlow 2s infinite ease-in-out;
      }

      /* Fixed Equalizer Wave Bars - Constrained within 48px widget */
      @keyframes eqBounce1 { 0%, 100% { height: 4px; y: 36px; } 50% { height: 18px; y: 22px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 16px; y: 24px; } 50% { height: 6px; y: 34px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 10px; y: 30px; } 50% { height: 20px; y: 20px; } }
      @keyframes eqBounce4 { 0%, 100% { height: 18px; y: 22px; } 50% { height: 8px; y: 32px; } }
      @keyframes eqBounce5 { 0%, 100% { height: 6px; y: 34px; } 50% { height: 16px; y: 24px; } }
      @keyframes eqBounce6 { 0%, 100% { height: 14px; y: 26px; } 50% { height: 5px; y: 35px; } }

      .eq1 { animation: eqBounce1 1.2s infinite ease-in-out; }
      .eq2 { animation: eqBounce2 1.4s infinite ease-in-out; }
      .eq3 { animation: eqBounce3 1.1s infinite ease-in-out; }
      .eq4 { animation: eqBounce4 1.5s infinite ease-in-out; }
      .eq5 { animation: eqBounce5 1.3s infinite ease-in-out; }
      .eq6 { animation: eqBounce6 1.6s infinite ease-in-out; }

      /* Radar Sweep Animation */
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-arm {
        transform-origin: 140px 24px;
        animation: radarSweep 2.5s linear infinite;
      }

      /* Grid Circuit Lines Glow */
      @keyframes cyberFade {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      .cyber-grid {
        animation: cyberFade 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="426" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Subtle Cyber Grid Background -->
  <g class="cyber-grid" stroke="#00f5d4" stroke-width="0.5" stroke-dasharray="3, 3">
    <line x1="30" y1="90" x2="850" y2="90" />
    <line x1="30" y1="160" x2="850" y2="160" />
    <line x1="30" y1="230" x2="850" y2="230" />
    <line x1="30" y1="300" x2="850" y2="300" />
    <line x1="30" y1="370" x2="850" y2="370" />
    <line x1="160" y1="50" x2="160" y2="400" />
    <line x1="320" y1="50" x2="320" y2="400" />
    <line x1="480" y1="50" x2="480" y2="400" />
    <line x1="640" y1="50" x2="640" y2="400" />
    <line x1="800" y1="50" x2="800" y2="400" />
  </g>

  <!-- Terminal Top Navigation Bar -->
  <path d="M 2 16 A 14 14 0 0 1 16 2 L 864 2 A 14 14 0 0 1 878 16 L 878 44 L 2 44 Z" fill="#060c18" />
  <line x1="2" y1="44" x2="878" y2="44" stroke="#172554" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="25" cy="23" r="6" fill="#ef4444" opacity="0.9" />
  <circle cx="45" cy="23" r="6" fill="#f59e0b" opacity="0.9" />
  <circle cx="65" cy="23" r="6" fill="#10b981" opacity="0.9" />

  <!-- Terminal Title & Status -->
  <text x="95" y="27" class="mono-text" font-size="12" fill="#64748b" font-weight="500">
    babu@quantum-core: ~ /telemetry/hud.sh
  </text>

  <!-- Live Status Ping Badge -->
  <g transform="translate(640, 14)">
    <rect x="0" y="0" width="220" height="20" rx="10" fill="#002b28" stroke="#00ffa3" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="10" r="4" fill="#00ffa3" class="pulse-circle" filter="url(#neonGlow)" />
    <text x="26" y="14" class="mono-text" font-size="10.5" fill="#00ffa3" font-weight="700" letter-spacing="0.5">STATUS: AI_CORE_ONLINE</text>
  </g>

  <!-- ================= LEFT COLUMN: TERMINAL CONSOLE HUD ================= -->
  <g transform="translate(24, 60)">
    <!-- Terminal Border Frame -->
    <rect x="0" y="0" width="460" height="348" rx="8" fill="#020612" stroke="#1e293b" stroke-width="1.2" />

    <!-- Terminal Inner Header -->
    <rect x="1" y="1" width="458" height="26" rx="7" fill="#070f22" />
    <text x="14" y="18" class="mono-text" font-size="11" fill="#38bdf8" font-weight="700">
      ⚡ SYSTEM TELEMETRY // VERBOSE LOGS
    </text>

    <!-- Terminal Lines -->
    <g class="mono-text" font-size="12">
      <!-- Line 1 -->
      <text x="16" y="52" fill="#64748b">&gt; identity:</text>
      <text x="150" y="52" fill="#00f5d4" font-weight="700" filter="url(#neonGlow)">Babu B</text>
      <text x="216" y="52" fill="#94a3b8">// Full Stack &amp; AI Engineer</text>

      <!-- Line 2 -->
      <text x="16" y="86" fill="#64748b">&gt; academics:</text>
      <text x="150" y="86" fill="#f1f5f9">B.Tech IT (2023–2027)</text>
      <rect x="326" y="73" width="116" height="19" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8"/>
      <text x="334" y="87" fill="#c7d2fe" font-size="10.5" font-weight="700">CGPA: 8.5 / 10</text>

      <!-- Line 3 -->
      <text x="16" y="120" fill="#64748b">&gt; experience:</text>
      <text x="150" y="120" fill="#38bdf8" font-weight="600">Ex-SDE Intern</text>
      <text x="250" y="120" fill="#94a3b8">@ MUA Cloud</text>

      <!-- Line 4 -->
      <text x="16" y="154" fill="#64748b">&gt; core_stack:</text>
      <text x="16" y="176" fill="#a7f3d0">
        [<tspan fill="#00f5d4">Spring Boot</tspan> • <tspan fill="#38bdf8">FastAPI</tspan> • <tspan fill="#c084fc">RAG Pipelines</tspan> • <tspan fill="#34d399">React</tspan>]
      </text>

      <!-- Line 5 -->
      <text x="16" y="208" fill="#64748b">&gt; databases:</text>
      <text x="150" y="208" fill="#cbd5e1">PostgreSQL • Supabase • Appwrite</text>

      <!-- Line 6 -->
      <text x="16" y="240" fill="#64748b">&gt; digital_hq:</text>
      <text x="150" y="240" fill="#00f5d4" font-weight="600">https://babudev.me</text>

      <!-- Line 7 -->
      <text x="16" y="272" fill="#64748b">&gt; location:</text>
      <text x="150" y="272" fill="#e2e8f0">Tamil Nadu, India 🇮🇳</text>

      <!-- Line 8 -->
      <text x="16" y="304" fill="#64748b">&gt; mission:</text>
      <text x="16" y="324" fill="#fbbf24" font-size="11" font-style="italic">
        "Architecting resilient systems &amp; intelligent AI solutions"
      </text>
      
      <!-- Blinking Cursor -->
      <rect x="424" y="313" width="7" height="13" fill="#00f5d4" class="cursor" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: PERFORMANCE GAUGES & HUD ================= -->
  <g transform="translate(502, 60)">
    <!-- Right Container Box -->
    <rect x="0" y="0" width="354" height="348" rx="8" fill="#020612" stroke="#1e293b" stroke-width="1.2" />

    <!-- Top Mini Header -->
    <rect x="1" y="1" width="352" height="26" rx="7" fill="#070f22" />
    <text x="14" y="18" class="mono-text" font-size="11" fill="#38bdf8" font-weight="700">
      📊 NEURAL METRICS &amp; ARCHITECTURE HUD
    </text>

    <!-- Mini Equalizer Frequency Bars Widget -->
    <g transform="translate(18, 40)">
      <rect x="0" y="0" width="130" height="48" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="8" y="14" class="mono-text" font-size="8.5" fill="#64748b" font-weight="700">STREAM ACTIVITY</text>
      
      <!-- Animated Equalizer Bars - Cleanly bounded inside widget box -->
      <rect x="14" y="30" width="6" height="10" rx="2" fill="#00f5d4" class="eq1" />
      <rect x="25" y="24" width="6" height="16" rx="2" fill="#38bdf8" class="eq2" />
      <rect x="36" y="28" width="6" height="12" rx="2" fill="#818cf8" class="eq3" />
      <rect x="47" y="22" width="6" height="18" rx="2" fill="#c084fc" class="eq4" />
      <rect x="58" y="32" width="6" height="8" rx="2" fill="#00ffa3" class="eq5" />
      <rect x="69" y="26" width="6" height="14" rx="2" fill="#00f5d4" class="eq6" />
      <rect x="80" y="28" width="6" height="12" rx="2" fill="#38bdf8" class="eq2" />
      <rect x="91" y="22" width="6" height="18" rx="2" fill="#f43f5e" class="eq4" />
      <rect x="102" y="30" width="6" height="10" rx="2" fill="#00ffa3" class="eq1" />
    </g>

    <!-- Radar Target Scanner Widget -->
    <g transform="translate(162, 40)">
      <rect x="0" y="0" width="174" height="48" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="8" y="14" class="mono-text" font-size="8.5" fill="#64748b" font-weight="700">RADAR FREQ // 5.8 GHz</text>
      
      <!-- Radar Circles -->
      <circle cx="140" cy="24" r="18" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="140" cy="24" r="10" fill="none" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="140" cy="24" r="3" fill="#00ffa3" />
      <!-- Radar Line Sweep -->
      <line x1="140" y1="24" x2="158" y2="24" stroke="#00f5d4" stroke-width="1.5" stroke-linecap="round" class="radar-arm" />
      <text x="8" y="34" class="mono-text" font-size="10" fill="#00ffa3" font-weight="700">ALL NODES OK</text>
    </g>

    <!-- ================= PROGRESS METRIC GAUGES ================= -->
    <g transform="translate(18, 102)" class="mono-text">
      <!-- Gauge 1: Backend Systems -->
      <text x="0" y="14" font-size="11" fill="#e2e8f0" font-weight="600">Full-Stack &amp; Scalable Backends</text>
      <text x="318" y="14" font-size="11" fill="#00f5d4" font-weight="700" text-anchor="end">96%</text>
      <line x1="0" y1="24" x2="318" y2="24" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="24" x2="305" y2="24" stroke="url(#barGrad1)" stroke-width="6" stroke-linecap="round" />

      <!-- Gauge 2: AI Engineering & RAG -->
      <text x="0" y="62" font-size="11" fill="#e2e8f0" font-weight="600">AI Architectures &amp; RAG Pipelines</text>
      <text x="318" y="62" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="end">92%</text>
      <line x1="0" y1="72" x2="318" y2="72" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="72" x2="292" y2="72" stroke="url(#barGrad2)" stroke-width="6" stroke-linecap="round" />

      <!-- Gauge 3: Microservices & Cloud -->
      <text x="0" y="110" font-size="11" fill="#e2e8f0" font-weight="600">Microservices &amp; Cloud Infra</text>
      <text x="318" y="110" font-size="11" fill="#c084fc" font-weight="700" text-anchor="end">90%</text>
      <line x1="0" y1="120" x2="318" y2="120" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="120" x2="286" y2="120" stroke="url(#barGrad3)" stroke-width="6" stroke-linecap="round" />

      <!-- Gauge 4: Real-Time WebSockets -->
      <text x="0" y="158" font-size="11" fill="#e2e8f0" font-weight="600">Real-Time Streaming &amp; SOS</text>
      <text x="318" y="158" font-size="11" fill="#00ffa3" font-weight="700" text-anchor="end">94%</text>
      <line x1="0" y1="168" x2="318" y2="168" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="168" x2="298" y2="168" stroke="url(#barGrad4)" stroke-width="6" stroke-linecap="round" />

      <!-- Bottom Mini Status Tag -->
      <g transform="translate(0, 196)">
        <rect x="0" y="0" width="318" height="28" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="mono-text" font-size="10.5" fill="#38bdf8">
          ⚡ PROTOCOL: <tspan fill="#00f5d4" font-weight="700">OPTIMIZED FOR SCALE</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
