<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#061325" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0.85" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00ffa3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowHeader" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-text {
        font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Segoe UI', monospace;
      }
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        letter-spacing: 6px;
      }

      /* Twinkling Stars Animation */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 4px #00f5d4); }
      }
      .star1 { animation: twinkle 3s infinite ease-in-out; transform-origin: 120px 40px; }
      .star2 { animation: twinkle 2.2s infinite ease-in-out 0.5s; transform-origin: 880px 50px; }
      .star3 { animation: twinkle 3.5s infinite ease-in-out 1s; transform-origin: 250px 140px; }
      .star4 { animation: twinkle 2.8s infinite ease-in-out 1.5s; transform-origin: 750px 130px; }
      .star5 { animation: twinkle 3.1s infinite ease-in-out 0.8s; transform-origin: 500px 30px; }

      /* Pulse Ring */
      @keyframes ping {
        0% { r: 3px; opacity: 0.9; }
        100% { r: 12px; opacity: 0; }
      }
      .ping-circle { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="230" fill="url(#headerBg)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00f5d4" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4, 4">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="140" x2="1000" y2="140" />
    <line x1="150" y1="0" x2="150" y2="230" />
    <line x1="350" y1="0" x2="350" y2="230" />
    <line x1="650" y1="0" x2="650" y2="230" />
    <line x1="850" y1="0" x2="850" y2="230" />
  </g>

  <!-- Twinkling Neon Stars -->
  <circle cx="120" cy="40" r="2.5" fill="#00f5d4" class="star1" />
  <circle cx="880" cy="50" r="2.5" fill="#00ffa3" class="star2" />
  <circle cx="250" cy="140" r="2" fill="#38bdf8" class="star3" />
  <circle cx="750" cy="130" r="2" fill="#00f5d4" class="star4" />
  <circle cx="500" cy="30" r="2.5" fill="#c084fc" class="star5" />

  <!-- Animated Wave Layer 1 (Back wave) -->
  <path fill="url(#wave1Grad)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M 0,160 Q 250,130 500,165 T 1000,160 L 1000,230 L 0,230 Z;
        M 0,165 Q 250,190 500,145 T 1000,170 L 1000,230 L 0,230 Z;
        M 0,160 Q 250,130 500,165 T 1000,160 L 1000,230 L 0,230 Z
      " />
  </path>

  <!-- Animated Wave Layer 2 (Front wave) -->
  <path fill="url(#wave2Grad)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M 0,185 Q 250,215 500,180 T 1000,190 L 1000,230 L 0,230 Z;
        M 0,175 Q 250,150 500,195 T 1000,180 L 1000,230 L 0,230 Z;
        M 0,185 Q 250,215 500,180 T 1000,190 L 1000,230 L 0,230 Z
      " />
  </path>

  <!-- Center HUD Badge Pill -->
  <g transform="translate(380, 24)">
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#031622" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="16" cy="12" r="4" fill="#00ffa3" />
    <circle cx="16" cy="12" r="4" fill="none" stroke="#00ffa3" stroke-width="1.5" class="ping-circle" />
    <text x="32" y="16" class="mono-text" font-size="10.5" fill="#00f5d4" font-weight="700" letter-spacing="1">SYSTEM ARCHITECT // ONLINE</text>
  </g>

  <!-- Main Headline: BABU B -->
  <text x="500" y="105" text-anchor="middle" class="title-text" font-size="52" fill="url(#titleGrad)" filter="url(#neonGlowHeader)">
    BABU B
  </text>

  <!-- Subtitle Line -->
  <text x="500" y="142" text-anchor="middle" class="mono-text" font-size="16.5" font-weight="600" fill="#e2e8f0" letter-spacing="2">
    Full Stack Developer <tspan fill="#00f5d4">|</tspan> AI &amp; Systems Engineer
  </text>

  <!-- Bottom Accent Wave Highlight -->
  <path d="M 0,228 L 1000,228" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.6" />
</svg>
